<app-tabla-generica
  endpoint="/colecciones"
  titulo="Colecciones"
  eyebrow="Catálogo"
  etiquetaNuevo="Nueva colección"
  placeholderBusqueda="Buscar colección"
  [columnas]="columnas"
  (crear)="abrirCrear()"
  (editar)="abrirEditar($event)"
/>

<app-dialogo-crud
  [guardando]="guardando()"
  [titulo]="editando() ? 'Editar colección' : 'Nueva colección'"
  formId="form-coleccion"
  [(visible)]="dialogoVisible"
>
  <form id="form-coleccion" [formGroup]="formulario" (ngSubmit)="guardar()" class="formulario">
    <label for="nombre">Nombre</label>
    <input id="nombre" pInputText formControlName="nombre" appAriaError="err-nombre" />
    <app-error-campo id="err-nombre" [control]="formulario.controls.nombre">Ingresa el nombre.</app-error-campo>

    <label for="descripcion">Descripción <span class="fs-caption">(opcional)</span></label>
    <input id="descripcion" pInputText formControlName="descripcion" />

    <label for="temporada">Temporada (opcional)</label>
    <p-select
      inputId="temporada"
      formControlName="temporada_id"
      [options]="temporadas()"
      optionLabel="nombre"
      optionValue="id"
      [showClear]="true"
      placeholder="Ninguna"
    />
  </form>
</app-dialogo-crud>
