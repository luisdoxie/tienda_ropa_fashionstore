<app-tabla-generica
  endpoint="/empleados"
  titulo="Empleados"
  eyebrow="Organización"
  etiquetaNuevo="Nuevo empleado"
  placeholderBusqueda="Buscar empleado"
  [columnas]="columnas"
  (crear)="abrirCrear()"
  (editar)="abrirEditar($event)"
/>

<app-dialogo-crud
  [guardando]="guardando()"
  [titulo]="editando() ? 'Editar empleado' : 'Nuevo empleado'"
  formId="form-empleado"
  [(visible)]="dialogoVisible"
>
  <form id="form-empleado" [formGroup]="formulario" (ngSubmit)="guardar()" class="formulario">
    <label for="usuario">Usuario</label>
    <p-select
      inputId="usuario"
      formControlName="usuario_id" appAriaError="err-usuario_id"
      [options]="opcionesUsuario()"
      optionLabel="etiqueta"
      optionValue="id"
      placeholder="Selecciona un usuario (rol cajero o encargado)"
    />
    <app-error-campo id="err-usuario_id" [control]="formulario.controls.usuario_id">Selecciona un usuario.</app-error-campo>

    <label for="sucursal">Sucursal</label>
    <p-select
      inputId="sucursal"
      formControlName="sucursal_id"
      [options]="sucursales()"
      optionLabel="nombre"
      optionValue="id"
      placeholder="Sin sucursal asignada"
      [showClear]="true"
    />

    <label for="cargo">Cargo</label>
    <input id="cargo" pInputText formControlName="cargo" />

    <label for="ci">CI</label>
    <input id="ci" pInputText formControlName="ci" />

    <label for="fecha_ingreso">Fecha de ingreso</label>
    <input id="fecha_ingreso" type="date" pInputText formControlName="fecha_ingreso" />
  </form>
</app-dialogo-crud>
