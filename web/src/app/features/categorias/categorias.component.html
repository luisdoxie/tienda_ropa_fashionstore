<app-tabla-generica
  endpoint="/categorias"
  titulo="Categorías"
  eyebrow="Catálogo"
  etiquetaNuevo="Nueva categoría"
  placeholderBusqueda="Buscar categoría"
  [columnas]="columnas"
  (crear)="abrirCrear()"
  (editar)="abrirEditar($event)"
/>

<app-dialogo-crud
  [guardando]="guardando()"
  [titulo]="editando() ? 'Editar categoría' : 'Nueva categoría'"
  formId="form-categoria"
  [(visible)]="dialogoVisible"
>
  <form id="form-categoria" [formGroup]="formulario" (ngSubmit)="guardar()" class="formulario">
    <label for="nombre">Nombre</label>
    <input id="nombre" pInputText formControlName="nombre" appAriaError="err-nombre" />
    <app-error-campo id="err-nombre" [control]="formulario.controls.nombre">Ingresa el nombre.</app-error-campo>

    <label for="descripcion">Descripción <span class="fs-caption">(opcional)</span></label>
    <input id="descripcion" pInputText formControlName="descripcion" />

    <label for="padre">Categoría padre (opcional)</label>
    <p-select
      inputId="padre"
      formControlName="categoria_padre_id"
      [options]="categorias()"
      optionLabel="nombre"
      optionValue="id"
      [showClear]="true"
      placeholder="Ninguna"
    />
  </form>
</app-dialogo-crud>
