<app-tabla-generica
  endpoint="/proveedores"
  titulo="Proveedores"
  eyebrow="Catálogo"
  etiquetaNuevo="Nuevo proveedor"
  placeholderBusqueda="Buscar proveedor"
  [columnas]="columnas"
  (crear)="abrirCrear()"
  (editar)="abrirEditar($event)"
/>

<app-dialogo-crud
  [guardando]="guardando()"
  [titulo]="editando() ? 'Editar proveedor' : 'Nuevo proveedor'"
  formId="form-proveedor"
  ancho="520px"
  [(visible)]="dialogoVisible"
>
  <form id="form-proveedor" [formGroup]="formulario" (ngSubmit)="guardar()" class="formulario">
    <label for="nombre">Nombre</label>
    <input id="nombre" pInputText formControlName="nombre" appAriaError="err-nombre" />
    <app-error-campo id="err-nombre" [control]="formulario.controls.nombre">Ingresa el nombre.</app-error-campo>

    <label for="nit">NIT</label>
    <input id="nit" pInputText formControlName="nit" />

    <label for="contacto">Contacto</label>
    <input id="contacto" pInputText formControlName="contacto" />

    <label for="telefono">Teléfono</label>
    <input id="telefono" pInputText formControlName="telefono" />

    <label for="email">Email</label>
    <input id="email" type="email" pInputText formControlName="email" appAriaError="err-email" />
    <app-error-campo id="err-email" [control]="formulario.controls.email">Ingresa un email válido.</app-error-campo>

    <label for="direccion">Dirección</label>
    <input id="direccion" pInputText formControlName="direccion" />

    <label for="usuario">Usuario vinculado</label>
    <p-select
      inputId="usuario"
      formControlName="usuario_id"
      [options]="opcionesUsuario()"
      optionLabel="etiqueta"
      optionValue="id"
      placeholder="Sin usuario asociado"
      [showClear]="true"
    />
  </form>
</app-dialogo-crud>
