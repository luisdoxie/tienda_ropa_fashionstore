<app-tabla-generica
  endpoint="/ciudades"
  titulo="Ciudades"
  eyebrow="Organización"
  etiquetaNuevo="Nueva ciudad"
  placeholderBusqueda="Buscar ciudad"
  [columnas]="columnas"
  (crear)="abrirCrear()"
  (editar)="abrirEditar($event)"
/>

<app-dialogo-crud
  [guardando]="guardando()"
  [titulo]="editando() ? 'Editar ciudad' : 'Nueva ciudad'"
  formId="form-ciudad"
  ancho="440px"
  [(visible)]="dialogoVisible"
>
  <form id="form-ciudad" [formGroup]="formulario" (ngSubmit)="guardar()" class="formulario">
    <label for="nombre">Nombre</label>
    <input id="nombre" pInputText formControlName="nombre" appAriaError="err-nombre" />
    <app-error-campo id="err-nombre" [control]="formulario.controls.nombre">Ingresa el nombre.</app-error-campo>

    <label for="departamento">Departamento</label>
    <input id="departamento" pInputText formControlName="departamento" />
  </form>
</app-dialogo-crud>
