@switch (tienda.estado()) {
  @case ('lista') {
    <router-outlet />
  }
  @case ('no_encontrada') {
    <app-tienda-no-disponible motivo="no_encontrada" />
  }
  @case ('no_disponible') {
    <app-tienda-no-disponible motivo="no_disponible" />
  }
  @case ('error') {
    <app-panel-estado-tienda
      icono="advertencia"
      titulo="No pudimos cargar la tienda"
      texto="Revisa tu conexión e inténtalo de nuevo."
    >
      <button type="button" class="fs-btn fs-btn--acento" (click)="reintentar()">Reintentar</button>
    </app-panel-estado-tienda>
  }
  @default {
    <section class="raiz-estado" aria-busy="true" aria-label="Cargando la tienda">
      <div class="raiz-esqueleto raiz-esqueleto--titulo"></div>
      <div class="raiz-esqueleto raiz-esqueleto--linea"></div>
      <div class="raiz-esqueleto raiz-esqueleto--linea"></div>
    </section>
  }
}
