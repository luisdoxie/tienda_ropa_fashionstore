@if (motivo() === 'no_disponible') {
  <app-panel-estado-tienda
    icono="sin-tienda"
    titulo="Tienda no disponible"
    texto="Esta tienda no está disponible por el momento."
  >
    <a class="fs-btn fs-btn--acento" routerLink="/">
      Ver otras tiendas
      <fs-icono nombre="flecha-derecha" [tam]="24" />
    </a>
  </app-panel-estado-tienda>
} @else {
  <app-panel-estado-tienda
    icono="sin-resultados"
    titulo="Tienda no encontrada"
    texto="No encontramos esta tienda. Revisa el enlace o busca otra."
  >
    <a class="fs-btn fs-btn--acento" routerLink="/">
      Ver otras tiendas
      <fs-icono nombre="flecha-derecha" [tam]="24" />
    </a>
  </app-panel-estado-tienda>
}
