<div class="auth-pantalla">
  <form class="auth-tarjeta" [formGroup]="formulario" (ngSubmit)="enviar()">
    <span class="auth-marca">
      @if (tienda.empresa(); as empresa) {
        Ingresás a {{ empresa.nombre }}
      } @else {
        FashionStore
      }
    </span>
    <h1 class="auth-titulo">Bienvenido de vuelta</h1>
    <p class="auth-subtitulo">Ingresá con tu cuenta de FashionStore</p>

    <label for="email">Email</label>
    <input id="email" type="email" pInputText formControlName="email" autocomplete="username" />

    <label for="password">Contraseña</label>
    <p-password
      inputId="password"
      formControlName="password"
      [feedback]="false"
      [toggleMask]="true"
      autocomplete="current-password"
    />

    <a class="auth-enlace" [routerLink]="rutaRecuperar()">¿Olvidaste tu contraseña?</a>
    <a class="auth-enlace" [routerLink]="rutaRegistro()" [queryParams]="queryParamsRegistro">¿No tenés cuenta? Registrate</a>

    @if (errorLogin()) {
      <p class="auth-error">{{ errorLogin() }}</p>
    }

    <p-button type="submit" label="Ingresar" [loading]="cargando()" styleClass="w-full" />
  </form>
</div>
